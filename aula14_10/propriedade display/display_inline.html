<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Inline</title>
    <style>
        .horizontal{
            list-style-type: none;
            padding: 0;
        }
        .horizontal li{
            display:inline;
        }
        .vertical{
            list-style-type: upper-roman;
        }
    </style>
</head>
<body>
    <!--Fazer um menu vertical e outro lado a lado-->
    <p>Obviamente, foi utilizado a propriedade de <strong>unordered list</strong></p>
    <h2>Menu horizontal</h2>
    <ul class="horizontal">
        <li> Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
    <h2>Menu vertical</h2>
    <ul class="vertical">
        <li>ITEM 1</li>
        <li>ITEM 2</li>
        <li>ITEM 3</li>
        <li>ITEM 4</li>
        <li>ITEM 5</li>
    </ul>
</body>
</html>
