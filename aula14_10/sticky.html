<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendo a position: fixed</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        section{
            height:600px;
            padding: 20px;
            background-color: lightgrey;
            margin-bottom: 10px;
        }

        h2{
            position: sticky;
            top: 0;
            background-color: lightblue;
            padding:10px;
            margin: 0;
        }
    </style>
</head>
<body>
    <section>
        <h2>Seção 1</h2>
        <p>Conteúdo da seção 1</p>
    </section>
    <section style="background-color: lightcoral;">
        <h2>Seção 2</h2>
        <p>Conteúdo da seção 1</p>
    </section>
    <section style="background-color: lightgreen;">
        <h2>Seção 3</h2>
        <p>Conteúdo da seção 1</p>
    </section>
</body>
</html>
