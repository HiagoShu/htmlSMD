<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 21/09 e 23/09</title>
</head>
<body>
    <header>

    </header>
    <main>
        <form>
            <label for="vol">Volume(between 0 and 50)</label>
            <input type="range" id="vol" name="vol" min="0" max="100" oninput="valor.innerHTML=this.value">
            <span id="valor">50</span>
        </form>
        <form>
            <label for="date">Calendário</label>
            <input type="date">
        </form>
        <form action="">
            <label for="myfile">Select a file</label>
            <input type="file" id="myfile" name="myfile"> <br> <br>
            <input type="submit"> Submit
        </form>
        <hr>
        <form>
            <div>
                <label for="mySearch">Search</label>
                <input type="search" id="mySearch" name="q" placeholder="User IDs are 4-8 characters in length" required size="30" minlength="4" maxlength="8">
                <button>Search</button>
            </div>
        </form>
        <hr>
        <form action="">
            <label for="quantity">Quantity(between 1 and 5)</label>
            <input type="number" id="quantity" name="quantity" min="1" max="5"> <br> <br> 
            <input type="submit" value="Submit">
        </form>
        <hr>
        <form>
            <label for="country_code">Country Code</label>
            <input type="text" id="country_code" name="country_code" pattern="[A-Za-z]{3}" title="Three letter country code">
            <input type="password" name="senha" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="A senha deve conter pelo menos 8 caracteres, ter ao menos uma letra minúscula, uma letra minúscula e um número.">
        </form>
        <hr>
        <form>
            <label for="username">Nome de Usuário</label>
            <input type="text" id="username" name="username" pattern="^[A-Z]{1}[A-Za-z0-9]{4,11}" title="Só pode começar com letra maiúscula, ter entre 5 e 12 caracteres e não pode caracteres especiais">
        </form>
        <hr>
        <form>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).{10}" title="A senha deve ter pelo menos 10 caracteres, incluindo uma letra maiúscula, uma letra minúscula, um número e um caractere especial" required>
            <input type="submit" value="Enviar">
        </form>
        <hr>
        <p>Datalist</p>
        <form action="">
            <input list="browsers" name="browsers">
            <datalist id="browsers">
                <option value="Internet Explorer"></option>
                <option value="Firefox"></option>
                <option value="Chrome"></option>
                <option value="Opera"></option>
                <option value="Safari"></option>
            </datalist>
            <input type="submit">
        </form>
        <br>
        <br>
        <hr>
        <form action="" oninput="x.value=parseInt(a.value)+parseInt(b.value)">
            <label for="vol">Volume(between 0 and 50)</label>
            <input type="range" id="a" name="a" value="100">
            100+
            <input type="range" id =b name="b" value="50">
            =
            <output id="x"></output>
            <br><br>
        </form>
        <br><br>
        <p>Progress: <progress value="67"  max="100"></p>
        <br>
        <br>
        <form action="" oninput="x.value=b.value=a.value">
            <label for="a">Controle Deslizante</label>
            <input type="range" id="a" name="a" min="0" max="100">
            <p>Barra de progresso: <progress id="b" value="0" max="100"></progress></p>

            <output id="x"></output>
        </form>
    </main>
    <footer>

    </footer>
</body>
</html>
