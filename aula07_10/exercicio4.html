<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4</title>
    <style>
        .container{
            width:400px;
            border:2px solid black;
            height: 600px;
        }

        .box1{
            width: 50px;
            height: 50px;
            background-color: lightblue;
        }
        .box2{
            width: 100px;
            height: 100px;
            position:relative; 
            top: 20px;
            left: 50px;
            color: black;
            background-color: red;
        }
        .box3{
            width: 100px;
            height:100px;
            position: absolute;
            top: 20px;
            left:50px;
            background-color: purple;
            color: black;
        }

        .box4{
            width: 100px;
            height: 100px;
            background-color: lightgreen;
        }
        .box5{
            width: 100px;
            height: 100px;
            background-color: lightslategrey;
        }

    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="box1">Box1</div>
            <div class="box2">Box2Relativa</div>
            <div class="box3">Box3Absoluta</div>
            <div class="box4">Box4</div>
            <div class="box5">Box5</div>
        </div>
    </main>
</body>
</html>
