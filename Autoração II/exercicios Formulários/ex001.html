<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <h1>Exercício 1 </h1>
    <p>Crie um formulário com um campo de entrada para nomes de usuário que deve:
        <ul>
            <li>Começar com uma letra maiúscula.</li>
            <li> Ter entre 5 e 12 caracteres.</li>
            <li>Não permitir caracteres especiais.</li>
            <li>Adicione uma mensagem de erro personalizada usando o atributo title</li>
        </ul>
    </p>
    <br><br>
    <form>
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" name="username" pattern="[A-Za-z][A-Za-z0-9]{4,11}" title="Começo com letra maiúscula, de 5 a 12 letras, sem caracteres especiais" required>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
